# 3つのAPIのDeployment(Podの定義)とService(クラスター内の宛先)。
#
# DBとAzureはクラスター内に立てず、stagingを使う。接続情報は各APIの
# server/<api>/.env に書き、start.ps1 がSecret(orcan-api-env など)にして渡す。
#
# 環境変数の優先順位(後のものが勝つ):
#   1. envFrom の1つ目 ... <api>-env Secret(.env の中身がそのまま入る)
#   2. envFrom の2つ目 ... pingucoin-cluster-config(クラスター内の宛先で上書き)
#   3. env            ... PORT(Serviceのポートと必ず合わせるため固定)
apiVersion: v1
kind: Service
metadata:
  name: orcan-api
spec:
  selector:
    app: orcan-api
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcan-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orcan-api
  template:
    metadata:
      labels:
        app: orcan-api
    spec:
      containers:
        - name: orcan-api
          image: pingucoin/orcan-api:dev
          # minikubeでビルドしたイメージを使う(レジストリからは取得しない)。
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: orcan-api-env
            - configMapRef:
                name: pingucoin-cluster-config
          env:
            - name: PORT
              value: "8080"
---
