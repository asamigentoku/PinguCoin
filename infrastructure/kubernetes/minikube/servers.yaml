apiVersion: v1
kind: Service
metadata:
  name: orcan-api
spec:
  selector:
    app: orcan-api
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcan-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orcan-api
  template:
    metadata:
      labels:
        app: orcan-api
    spec:
      containers:
        - name: orcan-api
          image: pingucoin/orcan-api:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pingucoin-config
          env:
            - name: PORT
              value: "8080"
            - name: DB_NAME
              value: orcan
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pingucoin-secrets
                  key: postgres-password
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pingucoin-secrets
                  key: internal-api-token
---
