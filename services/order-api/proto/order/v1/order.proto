syntax = "proto3";

package order.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/asamigentoku/PinguCoin/services/order-api/proto/order/v1;orderv1";

message Order {
  uint64 id = 1;
  uint64 user_id = 2;
  uint64 product_id = 3;
  int64 quantity = 4;
  int64 unit_price = 5;
  int64 total_amount = 6;
  uint64 payment_id = 7;
  string status = 8;
  string idempotency_key = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  string payment_method = 12;
  string currency = 13;
  string action_url = 14;
}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc HasPaidOrder(HasPaidOrderRequest) returns (HasPaidOrderResponse);
}

message CreateOrderRequest { uint64 user_id = 1; uint64 product_id = 2; int64 quantity = 3; string payment_method = 4; string idempotency_key = 5; int64 unit_price = 6; string currency = 7; }
message CreateOrderResponse { Order order = 1; bool replayed = 2; }
message GetOrderRequest { uint64 id = 1; uint64 user_id = 2; }
message GetOrderResponse { Order order = 1; }
message ListOrdersRequest { uint64 user_id = 1; }
message ListOrdersResponse { repeated Order orders = 1; }
message HasPaidOrderRequest { uint64 user_id = 1; uint64 product_id = 2; }
message HasPaidOrderResponse { bool paid = 1; }
