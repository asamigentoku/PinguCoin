# media-api の protobuf から Go のコードを生成する設定。リポジトリのルートから実行する(make proto)。
#   buf generate services/media-api/proto --template services/media-api/proto/buf.gen.yaml
# 生成したコードは .proto と同じフォルダに置き、media-api 自身も、呼び出す側(bff)も、同じ生成コードを import する。
version: v2
plugins:
  - local: protoc-gen-go
    out: services/media-api/proto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: services/media-api/proto
    opt: paths=source_relative
