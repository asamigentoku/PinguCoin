# 為替API専用のNginx Proxy Cacheです。
# BFFが保存する為替スナップショットのボリュームとは別領域です。
proxy_cache_path /var/cache/nginx/exchange-rate-cache
    levels=1:2
    keys_zone=exchange_rates:10m
    max_size=100m
    inactive=1y
    use_temp_path=off;

# キャッシュ状態(HIT/MISS/EXPIREDなど)をログへ出すための変数です。
map $uri $exchange_rate_cache_status {
    default $upstream_cache_status;
}

# 為替APIの性能とキャッシュ状態をnginx-metricsが読める形式で記録します。
log_format exchange_rate_metrics '$msec\t$request_time\t$status\t$exchange_rate_cache_status\t$uri';

server {
    # Nginxを外部公開用の入口として8082で待ち受けます。
    listen 8082;
    server_name _;

    client_max_body_size 1m;

    # Nginxが唯一の公開入口となり、BFFはComposeネットワーク内だけでアクセスされます。
    location / {
        # 為替API以外のリクエストはそのままBFFへ転送します。
        proxy_pass http://bff:8082;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # v1 caches the dynamic BFF/media-api response under one stable URL.
    location = /api/v1/exchange-rates {
        # v1はBFF/media-apiの動的レスポンスを固定URLで短時間キャッシュします。
        access_log /var/cache/nginx/exchange-rate-metrics.log exchange_rate_metrics;
        proxy_pass http://bff:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 読み取り系のGET/HEADだけをキャッシュ対象にします。
        proxy_cache exchange_rates;
        proxy_cache_methods GET HEAD;
        # 同一URLへの同時アクセスでBFFへの重複リクエストを防ぎます。
        proxy_cache_lock on;
        # upstreamのキャッシュ制御ヘッダーに従って再検証します。
        proxy_cache_revalidate on;
        # upstream障害時に利用可能なら古いキャッシュを返します。
        proxy_cache_use_stale error timeout invalid_header http_500 http_502 http_503 http_504;
        # クライアントとメトリクスにHIT/MISS状態を公開します。
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location ^~ /api/v2/exchange-rates/ {
        # v2はBFFが保存した日付・時刻付き静的スナップショットを転送します。
        access_log /var/cache/nginx/exchange-rate-metrics.log exchange_rate_metrics;
        proxy_pass http://bff:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静的ファイルもGET/HEADだけをキャッシュします。
        proxy_cache exchange_rates;
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout invalid_header http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
