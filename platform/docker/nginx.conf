proxy_cache_path /var/cache/nginx/forex levels=1:2 keys_zone=forex:1m max_size=10m inactive=10m;

server {
    listen 8082;
    server_name _;

    client_max_body_size 1m;

    # The frontend uses the same public URL as before. nginx is now the only
    # published entry point and the BFF remains private to the Compose network.
    location / {
        proxy_pass http://bff:8082;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location = /api/v1/exchange-rates {
        proxy_pass http://bff:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache forex;
        proxy_cache_lock on;
        proxy_cache_valid 200 3m;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
