name: pingucoin

x-api: &api
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-service-databases.sql:ro

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0
    ports: ["10000:10000"]
    volumes: ["azurite-data:/data"]

  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  media-api:
    <<: *api
    build: {context: ../.., dockerfile: services/media-api/Dockerfile}
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/media?sslmode=disable
      INTERNAL_API_TOKEN: local-internal-token
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      azurite: {condition: service_started}

  inventory-api:
    <<: *api
    build: {context: ../.., dockerfile: services/inventory-api/Dockerfile}
    environment:
      PORT: 8083
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/inventory?sslmode=disable
      INTERNAL_API_TOKEN: local-internal-token
      KAFKA_BROKERS: kafka:29092
    ports: ["8083:8083"]

  payment-api:
    <<: *api
    build: {context: ../.., dockerfile: services/payment-api/Dockerfile}
    environment:
      PORT: 8081
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/payment?sslmode=disable
      INTERNAL_API_TOKEN: local-internal-token
      KAFKA_BROKERS: kafka:29092
    ports: ["8081:8081"]

  order-api:
    <<: *api
    build: {context: ../.., dockerfile: services/order-api/Dockerfile}
    environment:
      PORT: 8084
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/orders?sslmode=disable
      INTERNAL_API_TOKEN: local-internal-token
      KAFKA_BROKERS: kafka:29092
      KAFKA_ORDER_TOPIC: orders.created.v1
    ports: ["8084:8084"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}

  bff:
    <<: *api
    build: {context: ../.., dockerfile: services/bff/Dockerfile}
    environment:
      PORT: 8082
      MEDIA_API_ADDR: media-api:8080
      INVENTORY_API_ADDR: inventory-api:8083
      PAYMENT_API_ADDR: payment-api:8081
      ORDER_API_ADDR: order-api:8084
      INTERNAL_API_TOKEN: local-internal-token
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports: ["8082:8082"]
    depends_on:
      media-api: {condition: service_started}
      order-api: {condition: service_started}

volumes:
  postgres-data:
  azurite-data:
