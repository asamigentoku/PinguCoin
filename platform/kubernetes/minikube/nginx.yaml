apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    proxy_cache_path /var/cache/nginx/exchange-rate-cache
      levels=1:2
      keys_zone=exchange_rates:10m
      max_size=100m
      inactive=1y
      use_temp_path=off;

    map $uri $exchange_rate_cache_status {
      default $upstream_cache_status;
    }

    log_format exchange_rate_metrics '$msec\t$request_time\t$status\t$exchange_rate_cache_status\t$uri';

    server {
      listen 8082;
      server_name _;

      location / {
        proxy_pass http://bff:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # v1 caches the dynamic BFF/media-api response under one stable URL.
      location = /api/v1/exchange-rates {
        access_log /var/cache/nginx/exchange-rate-metrics.log exchange_rate_metrics;
        proxy_pass http://bff:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache exchange_rates;
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout invalid_header http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
      }

      location ^~ /api/v2/exchange-rates/ {
        access_log /var/cache/nginx/exchange-rate-metrics.log exchange_rate_metrics;
        proxy_pass http://bff:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache exchange_rates;
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout invalid_header http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
      }

      location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: nginx
  ports:
    - port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.27.4-alpine
          ports:
            - name: http
              containerPort: 8082
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet: {path: /nginx-health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /nginx-health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
        - name: nginx-metrics
          image: pingucoin/nginx-metrics:dev
          imagePullPolicy: Never
          env:
            - name: NGINX_EXCHANGE_RATE_LOG
              value: /var/cache/nginx/exchange-rate-metrics.log
          ports:
            - name: metrics
              containerPort: 9113
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
              readOnly: true
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 10
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: nginx-config
        - name: cache
          emptyDir:
            sizeLimit: 128Mi
