apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
      listen 8082;
      server_name _;

      location / {
        proxy_pass http://bff:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location = /api/v1/exchange-rates/latest.json {
        alias /var/cache/nginx/exchange-rates/latest.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
      }

      location ~ ^/api/v1/exchange-rates/(?<rate_version>[0-9]+)\.json$ {
        alias /var/cache/nginx/exchange-rates/$rate_version.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
      }

      location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: nginx
  ports:
    - port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.27.4-alpine
          ports:
            - name: http
              containerPort: 8082
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: exchange-rates
              mountPath: /var/cache/nginx/exchange-rates
              readOnly: true
          readinessProbe:
            httpGet: {path: /nginx-health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /nginx-health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: config
          configMap:
            name: nginx-config
        - name: exchange-rates
          persistentVolumeClaim:
            claimName: exchange-rates
