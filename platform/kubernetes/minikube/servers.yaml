apiVersion: v1
kind: Service
metadata:
  name: pingu-api
spec:
  selector:
    app: pingu-api
  ports:
    - port: 8082
      targetPort: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingu-api
spec:
  # 常に2つ以上動かし、1つ落ちてもサービスを止めない。HPA(autoscaling.yaml)が負荷に応じて増減させる。
  replicas: 2
  # ローリングアップデート: 新しいPodがReadyになってから古いPodを止める(maxUnavailable: 0)ので、
  # デプロイ中もリクエストを受け付け続けられる。
