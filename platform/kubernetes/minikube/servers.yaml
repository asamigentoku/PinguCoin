# 3つのAPIのDeployment(Podの定義)とService(クラスター内の宛先)。
#
# DBとAzureはクラスター内に立てず、stagingを使う。接続情報は各APIの
# services/<api>/.env に書き、script/start.sh がSecret(orcan-api-env など)にして渡す。
#
# 環境変数の優先順位(後のものが勝つ):
#   1. envFrom の1つ目 ... <api>-env Secret(.env の中身がそのまま入る)
#   2. envFrom の2つ目 ... pingucoin-cluster-config(クラスター内の宛先で上書き)
#   3. env            ... PORT(Serviceのポートと必ず合わせるため固定)
#
# 運用向けの設定(スケール・障害対策)は各Deploymentに書いてある。
# 自動スケール(HPA)と、同時に落とせる数の制限(PDB)は autoscaling.yaml、
# 通信の制限は network-policy.yaml。
---
apiVersion: v1
kind: Service
metadata:
  name: orcan-api
spec:
  selector:
    app: orcan-api
  ports:
    - port: 8080
      targetPort: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcan-api
spec:
  # 常に2つ以上動かし、1つ落ちてもサービスを止めない。HPA(autoscaling.yaml)が負荷に応じて増減させる。
  replicas: 2
  # ローリングアップデート: 新しいPodがReadyになってから古いPodを止める(maxUnavailable: 0)ので、
  # デプロイ中もリクエストを受け付け続けられる。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # 過去のReplicaSetを残す数(ロールバック用: kubectl rollout undo)。
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: orcan-api
  template:
    metadata:
      labels:
        app: orcan-api
    spec:
      # このAPIはKubernetes APIを呼ばないので、ServiceAccountのトークンをPodに渡さない。
      automountServiceAccountToken: false
      # 終了の合図(SIGTERM)から強制終了(SIGKILL)までの猶予。
      terminationGracePeriodSeconds: 30
      # Podを別のノードに分散させ、1台のノードが落ちても全滅しないようにする。
      # minikubeは1ノードなので、置けなくてもエラーにしない(ScheduleAnyway)。
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: orcan-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orcan-api
          image: pingucoin/orcan-api:dev
          # minikubeに取り込んだイメージを使う(レジストリからは取得しない)。
          imagePullPolicy: Never
          ports:
            # probeとServiceからは、番号ではなくこの名前で参照する。
            - name: api
              containerPort: 8080
          envFrom:
            - secretRef:
                name: orcan-api-env
            - configMapRef:
                name: pingucoin-cluster-config
          env:
            - name: PORT
              value: "8080"
          # リソース: requests はスケジューラが確保する量(HPAのCPU使用率の基準にもなる)、
          # limits は超えられない上限(メモリは超えるとOOMKilledで再起動される)。
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # ヘルスチェック(probe)。
          #   startupProbe   ... 起動が終わるまで待つ。終わるまで他のprobeは動かない(最大 5秒 x 30回)
          #   readinessProbe ... 失敗するとServiceの宛先から外し、リクエストを送らない(再起動はしない)
          #   livenessProbe  ... 失敗が続くとコンテナを再起動する(固まったプロセスの自動復旧)
          # gRPC標準のヘルスチェック(grpc.health.v1)を使う。pkg/health を参照。
          #   service を省略 ... readiness。DBに接続できる間だけ SERVING
          #   liveness       ... プロセスが生きている間は常に SERVING(DBの障害では再起動しない)
          # (grpcのprobeは、名前付きポートではなく番号で指定する)
          startupProbe:
            grpc:
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            grpc:
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 8080
              service: liveness
            periodSeconds: 10
            failureThreshold: 3

          # 終了時: 先にServiceの宛先から外れるのを待ってから止める。
          # 外れる前に止めると、まだ届いているリクエストが失敗する。
          # (distrolessイメージにはシェルがないので、execのsleepではなくsleepアクションを使う)
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # コンテナの権限を最小にする。
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
