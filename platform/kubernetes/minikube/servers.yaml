    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # 過去のReplicaSetを残す数(ロールバック用: kubectl rollout undo)。
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: pingu-api
  template:
    metadata:
      labels:
        app: pingu-api
    spec:
      # このAPIはKubernetes APIを呼ばないので、ServiceAccountのトークンをPodに渡さない。
      automountServiceAccountToken: false
      # 終了の合図(SIGTERM)から強制終了(SIGKILL)までの猶予。
      terminationGracePeriodSeconds: 30
      # Podを別のノードに分散させ、1台のノードが落ちても全滅しないようにする。
      # minikubeは1ノードなので、置けなくてもエラーにしない(ScheduleAnyway)。
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pingu-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pingu-api
          image: pingucoin/pingu-api:dev
          # minikubeに取り込んだイメージを使う(レジストリからは取得しない)。
          imagePullPolicy: Never
          ports:
            # probeとServiceからは、番号ではなくこの名前で参照する。
            - name: api
              containerPort: 8082
          envFrom:
            - secretRef:
                name: pingu-api-env
            - configMapRef:
                name: pingucoin-cluster-config
          env:
            - name: PORT
              value: "8082"
          # リソース: requests はスケジューラが確保する量(HPAのCPU使用率の基準にもなる)、
          # limits は超えられない上限(メモリは超えるとOOMKilledで再起動される)。
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # ヘルスチェック(probe)。
          #   startupProbe   ... 起動が終わるまで待つ。終わるまで他のprobeは動かない(最大 5秒 x 30回)
          #   readinessProbe ... 失敗するとServiceの宛先から外し、リクエストを送らない(再起動はしない)
          #   livenessProbe  ... 失敗が続くとコンテナを再起動する(固まったプロセスの自動復旧)
          # HTTPのヘルスチェック。services/pingu-api/internal/httpapi/health_handler.go を参照。
          #   /readyz  ... DBに接続できる間だけ200(できなければ503)
          #   /healthz ... プロセスが応答できれば常に200(DBの障害では再起動しない)
          startupProbe:
            httpGet:
              path: /readyz
              port: api
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 10
            failureThreshold: 3

          # 終了時: 先にServiceの宛先から外れるのを待ってから止める。
          # 外れる前に止めると、まだ届いているリクエストが失敗する。
          # (distrolessイメージにはシェルがないので、execのsleepではなくsleepアクションを使う)
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # コンテナの権限を最小にする。s
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
