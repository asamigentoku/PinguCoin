# 通信の制限(NetworkPolicy)。
#
# 1. まず、namespace内のPodへの入ってくる通信を、すべて拒否する。
# 2. そのうえで、必要な通信だけ許可する。
#      media-api / payment-api ... bff からだけ受け付ける(ほかのPodやクラスター外からは届かない)
#      bff               ... 同じクラスター内のどこからでも受け付ける
#                                  (port-forward はkubelet経由なので、このポリシーの影響を受けない)
# NetworkPolicyを実際に効かせるには、それに対応したCNIが必要(minikubeの既定のkindnetは対応している)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bff-to-media-api
spec:
  podSelector:
    matchLabels:
      app: media-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [bff]
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bff-to-payment-api
spec:
  podSelector:
    matchLabels:
      app: payment-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [bff]
      ports:
        - port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bff-to-order-api
spec:
  podSelector: {matchLabels: {app: order-api}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: bff}}}]
      ports: [{port: 8084}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-bff
spec:
  podSelector:
    matchLabels:
      app: bff
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8082
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-api-to-postgres}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [media-api, inventory-api, payment-api, order-api]}
      ports: [{port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-domain-services-to-kafka}
spec:
  podSelector: {matchLabels: {app: kafka}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [inventory-api, payment-api, order-api]}
      ports: [{port: 9092}]
