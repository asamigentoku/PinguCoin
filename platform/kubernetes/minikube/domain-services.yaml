apiVersion: v1
kind: Service
metadata: {name: inventory-api}
spec:
  selector: {app: inventory-api}
  ports: [{port: 8083, targetPort: api}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: inventory-api}
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory-api}}
  template:
    metadata: {labels: {app: inventory-api}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: inventory-api
          image: pingucoin/inventory-api:dev
          imagePullPolicy: Never
          ports: [{name: api, containerPort: 8083}]
          envFrom: [{configMapRef: {name: pingucoin-cluster-config}}]
          env:
            - {name: PORT, value: "8083"}
            - {name: DATABASE_URL, value: "postgres://postgres:postgres@postgres:5432/inventory?sslmode=disable"}
            - {name: INTERNAL_API_TOKEN, value: local-internal-token}
          readinessProbe: {grpc: {port: 8083}}
          livenessProbe: {grpc: {port: 8083, service: liveness}}
---
apiVersion: v1
kind: Service
metadata: {name: order-api}
spec:
  selector: {app: order-api}
  ports: [{port: 8084, targetPort: api}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: order-api}
spec:
  replicas: 1
  selector: {matchLabels: {app: order-api}}
  template:
    metadata: {labels: {app: order-api}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: order-api
          image: pingucoin/order-api:dev
          imagePullPolicy: Never
          ports: [{name: api, containerPort: 8084}]
          envFrom: [{configMapRef: {name: pingucoin-cluster-config}}]
          env:
            - {name: PORT, value: "8084"}
            - {name: DATABASE_URL, value: "postgres://postgres:postgres@postgres:5432/orders?sslmode=disable"}
            - {name: INTERNAL_API_TOKEN, value: local-internal-token}
          readinessProbe: {grpc: {port: 8084}}
          livenessProbe: {grpc: {port: 8084, service: liveness}}
