apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
spec:
  # 常に2つ以上動かし、1つ落ちてもサービスを止めない。HPA(autoscaling.yaml)が負荷に応じて増減させる。
  replicas: 2
  # ローリングアップデート: 新しいPodがReadyになってから古いPodを止める(maxUnavailable: 0)ので、
  # デプロイ中もリクエストを受け付け続けられる。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # 過去のReplicaSetを残す数(ロールバック用: kubectl rollout undo)。
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      # このAPIはKubernetes APIを呼ばないので、ServiceAccountのトークンをPodに渡さない。
      automountServiceAccountToken: false
      # 終了の合図(SIGTERM)から強制終了(SIGKILL)までの猶予。
      terminationGracePeriodSeconds: 30
      # Podを別のノードに分散させ、1台のノードが落ちても全滅しないようにする。
      # minikubeは1ノードなので、置けなくてもエラーにしない(ScheduleAnyway)。
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bff
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 65532
      containers:
        - name: bff
          image: pingucoin/bff:dev
          # minikubeに取り込んだイメージを使う(レジストリからは取得しない)。
          imagePullPolicy: Never
          ports:
            # probeとServiceからは、番号ではなくこの名前で参照する。
            - name: api
              containerPort: 8082
            # メトリクス(/metrics)。API のポートとは別。Prometheus だけが取る(NetworkPolicy)。Service には出さない。
            - name: metrics
              containerPort: 9090
          envFrom:
            - secretRef:
                name: bff-env
            - configMapRef:
                name: pingucoin-cluster-config
          env:
            - name: PORT
              value: "8082"
            - name: EXCHANGE_RATE_DIRECTORY
              value: /var/lib/pingucoin/exchange-rates
            - {name: INTERNAL_API_TOKEN, value: local-internal-token}
          volumeMounts:
            - name: exchange-rates
              mountPath: /var/lib/pingucoin/exchange-rates
          # リソース: requests はスケジューラが確保する量(HPAのCPU使用率の基準にもなる)、
          # limits は超えられない上限(メモリは超えるとOOMKilledで再起動される)。
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # ヘルスチェック(probe)。
          #   startupProbe   ... 起動が終わるまで待つ。終わるまで他のprobeは動かない(最大 5秒 x 30回)
          #   readinessProbe ... 失敗するとServiceの宛先から外し、リクエストを送らない(再起動はしない)
          #   livenessProbe  ... 失敗が続くとコンテナを再起動する(固まったプロセスの自動復旧)
          # HTTPのヘルスチェック。services/bff/internal/httpapi/health_handler.go を参照。
          #   /readyz  ... DBに接続できる間だけ200(できなければ503)
          #   /healthz ... プロセスが応答できれば常に200(DBの障害では再起動しない)
          startupProbe:
            httpGet:
              path: /readyz
              port: api
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 10
            failureThreshold: 3

          # 終了時: 先にServiceの宛先から外れるのを待ってから止める。
          # 外れる前に止めると、まだ届いているリクエストが失敗する。
          # (distrolessイメージにはシェルがないので、execのsleepではなくsleepアクションを使う)
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # コンテナの権限を最小にする。s
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: exchange-rates
          persistentVolumeClaim:
            claimName: exchange-rates

