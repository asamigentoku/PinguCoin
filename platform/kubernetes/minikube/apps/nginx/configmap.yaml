apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    # 為替API専用のNginxキャッシュ領域です。
    # BFFが保存する為替スナップショットの領域とは別で、Nginx自身のProxy Cacheです。
    proxy_cache_path /var/cache/nginx/exchange-rate-cache
      levels=1:2
      keys_zone=exchange_rates:10m
      max_size=100m
      inactive=1y
      use_temp_path=off;

    # upstreamのキャッシュ状態をログに出すための変数です。
    # HIT/MISS/EXPIREDなどをnginx-metricsが集計します。
    map $uri $exchange_rate_cache_status {
      default $upstream_cache_status;
    }

    # 為替APIの応答時間・HTTPステータス・キャッシュ状態をタブ区切りで記録します。
    log_format exchange_rate_metrics '$msec\t$request_time\t$status\t$exchange_rate_cache_status\t$uri';

    server {
      # Nginxを外部公開用の入口として8082で待ち受けます。
      listen 8082;
      server_name _;

      location / {
        # 為替API以外のリクエストは、すべてBFFへ転送します。
        proxy_pass http://bff:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # v1 caches the dynamic BFF/media-api response under one stable URL.
      location = /api/v1/exchange-rates {
        # v1は固定URLでBFFへ転送し、レスポンスをNginxで短時間キャッシュします。
        access_log /var/cache/nginx/exchange-rate-metrics.log exchange_rate_metrics;
        proxy_pass http://bff:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GET/HEADだけをキャッシュ対象にします。POSTなどの更新系リクエストはキャッシュしません。
        proxy_cache exchange_rates;
        proxy_cache_methods GET HEAD;
        # 同じ瞬間の大量リクエストが全てBFFへ流れないよう、同一キーの取得を1つにまとめます。
        proxy_cache_lock on;
        # BFFのCache-Controlなどを使ってキャッシュの有効性を再確認します。
        proxy_cache_revalidate on;
        # BFFや上流サービスが一時的に落ちても、古い値を返せる場合は利用します。
        proxy_cache_use_stale error timeout invalid_header http_500 http_502 http_503 http_504;
        # クライアントがHIT/MISSを確認できるようにヘッダーへ状態を追加します。
        add_header X-Cache-Status $upstream_cache_status always;
      }

      location ^~ /api/v2/exchange-rates/ {
        # v2は日付・時刻付きの静的スナップショットをBFFへ転送します。
        access_log /var/cache/nginx/exchange-rate-metrics.log exchange_rate_metrics;
        proxy_pass http://bff:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静的スナップショットもGET/HEADだけをキャッシュします。
        proxy_cache exchange_rates;
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout invalid_header http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
      }

      location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }
    }

