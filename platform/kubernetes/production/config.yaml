# クラスター内の宛先だけを決める設定(機密ではない)。
#
# 各APIの環境変数は、Key Vault の値から作った Secret(<api>-env)で渡す(deploy-production.yml)。
# このConfigMapを servers.yaml の envFrom の「最後」に置き、Secret の値よりも優先させて、
# クラスター内のService名に向ける。
apiVersion: v1
kind: ConfigMap
metadata:
  name: pingucoin-cluster-config
data:
  ORCAN_API_ADDR: orcan-api:8080
  PAYMENT_API_ADDR: payment-api:8081
