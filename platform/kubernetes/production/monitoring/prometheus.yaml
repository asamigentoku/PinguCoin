# Prometheus(メトリクスを集めて、保存する)。本番(AKS)用。
#   - 設定と、アラートのルールは、ConfigMap「prometheus-config」(prometheus.yml / alert-rules.yml。kustomization.yaml が作る)
#   - 保存先は、ディスク(PVC「prometheus-data」。Azure Disk の StandardSSD、5 GiB)。Pod を作り直しても、データは残る。
#     保存は 7 日分、または 4 GB まで(古いものから消える)。ディスクの料金は、月 数十円(docs/COST.md)。
#   - インターネットには、公開しない(Ingress も Service の外部公開も無い)。画面は、AKS の管理者が、port-forward で開く:
#     kubectl port-forward -n pingucoin svc/prometheus 9090:9090 → http://localhost:9090
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
# Pod・ノードを見つけて(サービスディスカバリ)、kubelet の cAdvisor を API サーバー経由で取るための、読み取りだけの権限。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pingucoin-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pingucoin-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pingucoin-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: pingucoin
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  labels:
    app: prometheus
spec:
  accessModes: ["ReadWriteOnce"]
  # AKS の既定のストレージクラス(StandardSSD の Azure Disk)。最小のサイズで足りる(ディスクの最小の課金単位は 4 GiB)。
  storageClassName: managed-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  # 保存先を1つの Pod だけが使うので、止めてから、起動する(同時に2つは、動かさない)。
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --storage.tsdb.retention.size=4GB
            - --web.console.libraries=/usr/share/prometheus/console_libraries
            - --web.console.templates=/usr/share/prometheus/consoles
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            failureThreshold: 60 # 起動のとき、保存済みのデータの読み込みに時間がかかることがある
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
