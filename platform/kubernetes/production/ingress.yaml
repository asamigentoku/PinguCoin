# bff を、インターネットに公開する入口(HTTPS)。
#   - ingressClassName: AKS の「アプリケーションルーティング」アドオン(マネージドの NGINX)。Terraform で有効にする。
#   - TLS 証明書: cert-manager が Let's Encrypt から自動で取得・更新する(production/cert-manager/ を参照)。
#   - host は、デプロイ時に BFF_API_HOSTへ差し替える。
# media-api / payment-api は公開しない(クラスター内の通信だけ)。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bff
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # 商品ファイルのアップロードは Azure Blob に直接送るので、API 本体に大きなリクエストは来ない。
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts:
        - api.pingucoin.example
      secretName: bff-tls
  rules:
    - host: api.pingucoin.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bff
                port:
                  number: 8082
