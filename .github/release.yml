# GitHub Release の「変更の一覧」(自動生成)を、PR のラベルで分類する設定。
# release.yml(ワークフロー)が、リリースを作るときに使う。ラベルは、PR に付ける。
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]
  categories:
    - title: 互換性を壊す変更(破壊的変更)
      labels:
        - breaking-change
    - title: 新機能
      labels:
        - feature
        - enhancement
    - title: バグ修正
      labels:
        - bug
    - title: セキュリティ
      labels:
        - security
    - title: インフラ・デプロイ
      labels:
        - infrastructure
        - ci
    - title: ドキュメント
      labels:
        - documentation
    - title: その他の変更
      labels:
        - "*"
