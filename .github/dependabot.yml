# Dependabot: 依存ライブラリ・Docker イメージ・GitHub Actions・Terraform のプロバイダーの更新を、
# **週に1回、1本のプルリクエストにまとめて**知らせる(multi-ecosystem-groups)。
# 更新の PR も、通常の PR と同じく ci.yml が動く(テストが通れば、安心してマージできる)。
# 方針・扱い方は docs/DEPENDABOT.md を参照。
#
# 1本にまとめる:
#   - 下の multi-ecosystem-groups の「all-dependencies」に、すべての更新(updates)が入る。
#   - メジャーバージョンの更新は、この PR に入れない(ignore)。影響が大きく、1本にまとめると、1つのせいで、PR 全体が通らなくなるため。
#     メジャーを上げたいときは、docs/DEPENDABOT.md の手順で、ignore を一時的に外す。
#   - 脆弱性の更新(Dependabot security updates)は、この設定とは別に、すぐに、個別の PR になる(有効にしておく)。
version: 2

multi-ecosystem-groups:
  all-dependencies:
    # 週に1回(月曜 朝 9 時・日本時間)。
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    pull-request-branch-name:
      separator: "/"

updates:
  # ---------------------------------------------------------------- Go
  # Go のモジュールは、ルートに1つ(go.mod)。3つのサービスと pkg/ が使う。
  - package-ecosystem: gomod
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    ignore:
      # メジャーバージョンは、この PR に入れない(上の説明を参照)。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # gqlgen は、上げたら GraphQL の生成コードを作り直す必要がある(cd services/pingu-api && go tool gqlgen generate)。
      # 自動の PR では作り直せないので、手動で上げる。
      - dependency-name: "github.com/99designs/gqlgen"

  # ---------------------------------------------------------------- npm(フロントエンド)
  - package-ecosystem: npm
    directories:
      - /apps/client-web
      - /apps/admin-web
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------- Docker
  # 3つのサービスの Dockerfile(ビルド用の golang と、実行用の distroless のイメージ)。
  - package-ecosystem: docker
    directories:
      - /services/orcan-api
      - /services/payment-api
      - /services/pingu-api
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    ignore:
      # Go のバージョンは、go.mod / mise.toml / CI(setup-go)と揃えて、手動で上げる(patch だけ、自動)。
      - dependency-name: "golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ローカル開発用の Postgres / Redis などのイメージ。
  - package-ecosystem: docker-compose
    directory: /platform/docker
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------- GitHub Actions
  # ワークフロー(/.github/workflows)と、本番だけの処理の部品(/.github/actions/production/*)で使うアクション。
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/production/*
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------- Terraform
  # プロバイダー(azurerm など)と、ロックファイル(.terraform.lock.hcl)。
  # 本番の Terraform の plan は、Azure にログインできる ID で動くので、Dependabot の PR では動かない(動かさない)。
  # この PR に Terraform の更新が入っているときは、マージ前に、手元で plan を確認する(docs/DEPENDABOT.md を参照)。
  - package-ecosystem: terraform
    directories:
      - /platform/terraform/envs/production
      - /platform/terraform/envs/staging
      - /platform/terraform/envs/staging/azure-blob
      - /platform/terraform/envs/staging/supabase
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
