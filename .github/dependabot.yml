# Dependabot: 依存ライブラリ・Docker イメージ・GitHub Actions・Terraform のプロバイダーの更新を、プルリクエストで知らせる。
# 更新の PR も、通常の PR と同じく ci.yml が動く(テストが通れば、安心してマージできる)。
# 方針・扱い方は docs/DEPENDABOT.md を参照。
#
# 共通のルール:
#   - 週に1回(月曜 朝 9 時・日本時間)。毎日だと、PR が多すぎるため。
#   - 同じ系統のライブラリは、1つの PR にまとめる(groups)。メジャーバージョンの更新は、まとめず、別の PR にする(影響が大きいため)。
#   - 開く PR の数に上限を付ける(溜まりすぎて、見なくなるのを防ぐ)。
version: 2

updates:
  # ---------------------------------------------------------------- Go
  # Go のモジュールは、ルートに1つ(go.mod)。3つのサービスと pkg/ が使う。
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, go]
    groups:
      # gRPC と protobuf は、バージョンを揃えて上げる。
      #   注意: protobuf を上げたら、生成コードも最新のツールで作り直すとよい(make proto)。
      grpc-protobuf:
        patterns:
          - "google.golang.org/grpc*"
          - "google.golang.org/protobuf*"
          - "google.golang.org/genproto*"
        update-types: [minor, patch]
      azure-sdk:
        patterns:
          - "github.com/Azure/*"
        update-types: [minor, patch]
      gorm:
        patterns:
          - "gorm.io/*"
          - "github.com/jackc/*"
        update-types: [minor, patch]
      go-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # gqlgen は、上げたら GraphQL の生成コードを作り直す必要がある(cd services/pingu-api && go tool gqlgen generate)。
      # 自動の PR では作り直せないので、手動で上げる。
      - dependency-name: "github.com/99designs/gqlgen"

  # ---------------------------------------------------------------- npm(フロントエンド)
  - package-ecosystem: npm
    directory: /apps/client-web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, javascript]
    groups:
      # Next.js と React は、揃えて上げる。
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next"]
        update-types: [minor, patch]
      clerk:
        patterns: ["@clerk/*"]
        update-types: [minor, patch]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "postcss*"]
        update-types: [minor, patch]
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/admin-web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, javascript]
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next"]
        update-types: [minor, patch]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "postcss*"]
        update-types: [minor, patch]
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # ---------------------------------------------------------------- Docker
  # 3つのサービスの Dockerfile(ビルド用の golang と、実行用の distroless のイメージ)。
  - package-ecosystem: docker
    directories:
      - /services/orcan-api
      - /services/payment-api
      - /services/pingu-api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, docker]
    ignore:
      # Go のバージョンは、go.mod / mise.toml / CI(setup-go)と揃えて、手動で上げる。
      - dependency-name: "golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # ローカル開発用の Postgres / Redis などのイメージ。
  - package-ecosystem: docker-compose
    directory: /platform/docker
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, docker]

  # ---------------------------------------------------------------- GitHub Actions
  # ワークフロー(/.github/workflows)と、本番だけの処理の部品(/.github/actions/production/*)で使うアクション。
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/production/*
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, github-actions]
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # ---------------------------------------------------------------- Terraform
  # プロバイダー(azurerm など)と、ロックファイル(.terraform.lock.hcl)。
  # 本番の Terraform の plan は、Azure にログインできる ID で動くので、Dependabot の PR では動かない(動かさない)。
  # 更新の PR は、ローカルか、手動で plan を確認してからマージする(docs/DEPENDABOT.md を参照)。
  - package-ecosystem: terraform
    directories:
      - /platform/terraform/envs/production
      - /platform/terraform/envs/staging
      - /platform/terraform/envs/staging/azure-blob
      - /platform/terraform/envs/staging/supabase
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, terraform]
