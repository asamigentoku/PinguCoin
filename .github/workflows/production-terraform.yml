# 本番のインフラ(AKS / PostgreSQL / Blob / ACR / Key Vault)を Terraform で管理する。
#   プルリクエスト       ... plan だけ(何が変わるかを確認する。変更は加えない)
#   production ブランチ  ... plan のあと、「production-infra」環境の承認を待って apply する
#   main ブランチ        ... 何も動かない(main へのマージでは、本番に変更が入らない)
#
# 本番用のワークフローは、名前の頭に production- を付けている(GitHub は、workflows/ の直下のファイルしか読まないため)。
# 本番だけの処理(terraform init など)は、.github/actions/production/ の部品にまとめてある。
# Azure へのログインは OIDC(パスワードなし)。準備は script/bootstrap-azure.sh、設定する値は docs/DEPLOYMENT.md を参照。
name: "Production: Terraform"

on:
  pull_request:
    paths:
      - "platform/terraform/envs/production/**"
      - ".github/workflows/production-terraform.yml"
      - ".github/actions/production/terraform-init/**"
  # 本番に反映するのは、production ブランチへの push だけ(main では動かない)。
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  id-token: write # OIDC で Azure にログインするのに必要
  contents: read

# state のロックと同じく、同時に1つだけ実行する(apply の途中で止めない)。
concurrency:
  group: production-terraform
  cancel-in-progress: false

env:
  TF_WORKDIR: platform/terraform/envs/production
  # azurerm provider が OIDC で認証するための設定。
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: plan
    # Dependabot の PR には、Azure にログインする権限(OIDC)を渡さないので、plan は動かさない(動かすと、失敗して赤くなるだけ)。
    # Dependabot の Terraform の更新は、マージ前に、手元で plan を確認する(docs/DEPENDABOT.md)。
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKDIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive

      - uses: ./.github/actions/production/terraform-init
        with:
          working-directory: ${{ env.TF_WORKDIR }}
          state-resource-group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          state-storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          state-container: ${{ vars.TFSTATE_CONTAINER }}
          tfvars: ${{ vars.TFVARS }}
      - run: terraform validate

      # plan のファイルは、パスワードなどの秘密を含むので、artifact には保存しない(apply で、もう一度 plan する)。
      - name: terraform plan
        run: terraform plan -no-color -lock-timeout=5m | tee plan.txt
      - name: 結果をジョブの要約に出す
        if: always()
        run: |
          {
            echo '## terraform plan (production)'
            echo '```'
            tail -n 200 plan.txt 2>/dev/null || echo "(plan did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: apply
    # PR では apply しない。production ブランチ(への push、またはそのブランチでの手動実行)のときだけ、承認を待って apply する。
    # 手動実行は、ほかのブランチを選んでも、ここで止まる。
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
    needs: plan
    runs-on: ubuntu-latest
    # この環境(production-infra)に「承認者」を設定すると、承認されるまでここで止まる。
    environment: production-infra
    defaults:
      run:
        working-directory: ${{ env.TF_WORKDIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - uses: ./.github/actions/production/terraform-init
        with:
          working-directory: ${{ env.TF_WORKDIR }}
          state-resource-group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          state-storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          state-container: ${{ vars.TFSTATE_CONTAINER }}
          tfvars: ${{ vars.TFVARS }}

      - name: terraform apply
        run: terraform apply -auto-approve -no-color -lock-timeout=10m

      - name: デプロイ用の値を要約に出す(GitHub の Environment「production」の Variables に設定する)
        run: |
          {
            echo '## terraform output'
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
