# プルリクエストと main への push で、ビルド・テスト・設定の検証をする。
name: CI

on:
  pull_request:
  push:
    branches: [main, production]

permissions:
  contents: read

# 同じブランチで続けて push したときは、古い実行を止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Go のビルド・検証・テスト。production-deploy.yml も同じものを使う(共通: _go-test.yml)。
  go:
    uses: ./.github/workflows/_go-test.yml

  proto:
    name: protobuf (lint / 互換性 / 生成コードが最新か)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 比較先(PR の宛先ブランチ)と比べるため
      - uses: bufbuild/buf-setup-action@v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: protoc-gen-go / protoc-gen-go-grpc
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - run: buf lint
      # サービス間の API(gRPC)の互換性を、PR の宛先ブランチと比べて確かめる。
      # 項目や RPC の削除、型・番号の変更のような、互換性を壊す変更があると失敗する(docs/VERSIONING.md)。
      # 意図して壊すときは、パッケージのバージョンを上げる(orcan.v1 → orcan.v2)。
      - name: 互換性を壊す変更がないか(buf breaking)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE":"refs/remotes/origin/$BASE"
          # 比較先に buf.yaml が無い(ディレクトリ構成の移行前)ときは、比べられないので、移行後の PR から確かめる。
          if git cat-file -e "refs/remotes/origin/$BASE:buf.yaml" 2>/dev/null; then
            buf breaking --against ".git#ref=refs/remotes/origin/$BASE"
          else
            echo "比較先($BASE)に buf.yaml がないため、互換性の確認をスキップします"
          fi
      - name: 生成コードがコミット済みのものと同じか
        run: |
          buf generate services/orcan-api/proto --template services/orcan-api/proto/buf.gen.yaml
          buf generate services/payment-api/proto --template services/payment-api/proto/buf.gen.yaml
          git diff --exit-code -- services/orcan-api/proto services/payment-api/proto

  web:
    name: Web (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client-web, admin-web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24: TypeScript のテスト(node --test)を、そのまま実行できる。
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # テストがあるアプリだけ(client-web の retry など)。
      - run: npm test --if-present

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [orcan-api, payment-api, pingu-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      # push はしない。Dockerfile がビルドできるかだけ確認する(デプロイは production-deploy.yml)。
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # kustomize でマニフェストを組み立てられるか(参照しているファイルや、YAML の書き間違いがないか)。
      - name: kustomize build
        run: |
          kubectl kustomize platform/kubernetes/minikube > /dev/null
          kubectl kustomize platform/kubernetes/production > /dev/null

  terraform:
    name: Terraform (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [production]
    defaults:
      run:
        working-directory: platform/terraform/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      # backend には接続せずに、構文と引数だけを検証する(認証は要らない)。
      - run: terraform init -backend=false
      - run: terraform validate
