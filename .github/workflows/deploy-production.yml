# API(orcan-api / payment-api / pingu-api)を、本番の AKS にデプロイする。
#   1. テスト
#   2. イメージをビルドして、ACR に push(タグは git の SHA)
#   3. 「production」環境の承認を待って、AKS にデプロイ(Secret は Key Vault の値から作る)
#
# Azure へのログインは OIDC(パスワードなし)。準備は script/bootstrap-azure.sh、設定する値は docs/DEPLOYMENT.md を参照。
name: Deploy (production)

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "platform/kubernetes/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:
    inputs:
      restart:
        description: "イメージが同じでも、Pod を再起動する(Secret だけ変えたときなど)"
        type: boolean
        default: false

permissions:
  id-token: write # OIDC で Azure にログインするのに必要
  contents: read

# 同時に1つだけデプロイする。実行中のデプロイは止めない(途中で止めると、中途半端な状態になる)。
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NAMESPACE: pingucoin

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pingucoin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pingucoin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pingucoin_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./... -count=1

  build:
    name: build (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [orcan-api, payment-api, pingu-api]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ACR にログイン
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - uses: docker/setup-buildx-action@v3
      # イメージのタグは git の SHA。同じタグを上書きしないので、いつでも、その時点のイメージに戻せる。
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    # この環境(production)に「承認者」を設定すると、承認されるまでここで止まる。
    environment:
      name: production
      url: https://${{ vars.PINGU_API_HOST }}
    env:
      ACR_LOGIN_SERVER: ${{ vars.ACR_NAME }}.azurecr.io
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/setup-kubectl@v4
      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: "v0.1.9"
      - uses: azure/setup-helm@v4
      - uses: imranismail/setup-kustomize@v2

      # AKS はローカルの管理者アカウントを無効にしているので、Microsoft Entra ID(az のログイン)で kubectl を使う。
      - name: AKS につなぐ
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          kubectl get nodes

      # TLS 証明書を自動で取得・更新する cert-manager(Ingress の HTTPS に使う)。入っていれば、何も変わらない。
      - name: cert-manager を入れる
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --version v1.17.2 \
            --set crds.enabled=true \
            --wait --timeout 5m
      - name: ClusterIssuer(Let's Encrypt)
        run: |
          sed "s|EMAIL|${{ vars.LETSENCRYPT_EMAIL }}|" platform/kubernetes/production/cert-manager/cluster-issuer.yaml | kubectl apply -f -

      # DB の接続URLなどは、Key Vault から読んで、Kubernetes の Secret(<api>-env)にする。
      # ログに出ないよう、値は読んだ直後にマスクする。Secret のファイルは作ったらすぐに消す。
      - name: Secret を作る(Key Vault から)
        env:
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          set -euo pipefail
          kubectl apply -f platform/kubernetes/production/namespace.yaml

          kv() {
            local value
            value="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$1" --query value -o tsv)"
            echo "::add-mask::$value"
            printf '%s' "$value"
          }
          apply_secret() {  # $1 = Secret 名。標準入力に KEY=value を渡す
            local file="$RUNNER_TEMP/$1.env"
            (umask 077; cat > "$file")
            kubectl create secret generic "$1" -n "$NAMESPACE" --from-env-file="$file" --dry-run=client -o yaml | kubectl apply -f -
            rm -f "$file"
          }

          INTERNAL_API_TOKEN="$(kv internal-api-token)"

          apply_secret orcan-api-env <<EOF
          DATABASE_URL=$(kv orcan-database-url)
          INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
          AZURE_STORAGE_CONNECTION_STRING=$(kv storage-connection-string)
          AZURE_STORAGE_PUBLIC_CONTAINER=${{ vars.AZURE_STORAGE_PUBLIC_CONTAINER }}
          AZURE_STORAGE_PRIVATE_CONTAINER=${{ vars.AZURE_STORAGE_PRIVATE_CONTAINER }}
          APP_ENV=production
          EOF

          apply_secret payment-api-env <<EOF
          DATABASE_URL=$(kv payment-database-url)
          INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
          EOF

          apply_secret pingu-api-env <<EOF
          DATABASE_URL=$(kv pingu-database-url)
          INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
          CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
          EOF

      - name: マニフェストを適用する
        run: |
          set -euo pipefail
          # リポジトリの中のファイルは書き換えず、コピーの上でイメージのタグと公開ホスト名を差し替える。
          cp -r platform/kubernetes/production "$RUNNER_TEMP/k8s"
          cd "$RUNNER_TEMP/k8s"
          for api in orcan-api payment-api pingu-api; do
            kustomize edit set image "pingucoin/${api}=${ACR_LOGIN_SERVER}/${api}:${GITHUB_SHA}"
          done
          sed -i "s|api.pingucoin.example|${{ vars.PINGU_API_HOST }}|g" ingress.yaml
          kubectl apply -k .

      - name: Pod を再起動する(指定したときだけ)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restart }}
        run: |
          for api in orcan-api payment-api pingu-api; do
            kubectl rollout restart -n "$NAMESPACE" "deployment/${api}"
          done

      # ローリングアップデートが終わる(新しい Pod が Ready になる)まで待つ。間に合わなければ、ここで失敗する。
      - name: ロールアウトを待つ
        run: |
          for api in orcan-api payment-api pingu-api; do
            kubectl rollout status -n "$NAMESPACE" "deployment/${api}" --timeout=300s
          done
          kubectl get pods -n "$NAMESPACE"

      # クラスターの中から、pingu-api のヘルスチェックを確認する(DB に接続できているか)。
      - name: スモークテスト
        run: |
          kubectl port-forward -n "$NAMESPACE" service/pingu-api 18082:8082 &
          forward=$!
          trap 'kill $forward' EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:18082/readyz; then echo; exit 0; fi
            sleep 2
          done
          echo "readyz が 200 を返しません" >&2
          exit 1

      # デプロイに失敗したら、直前の状態に戻す。
      - name: 失敗したら元に戻す
        if: failure()
        run: |
          for api in orcan-api payment-api pingu-api; do
            kubectl rollout undo -n "$NAMESPACE" "deployment/${api}" || true
          done
