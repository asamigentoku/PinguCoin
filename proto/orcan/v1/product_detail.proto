syntax = "proto3";

package orcan.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/asamigentoku/PinguCoin/server/orcan-api/internal/pb/orcan/v1;orcanv1";

message ProductDetail {
  uint32 id = 1;
  uint32 product_id = 2;
  string image_url = 3;
  string description = 4;
  int32 sort_order = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

service ProductDetailService {
  rpc ListProductDetails(ListProductDetailsRequest) returns (ListProductDetailsResponse);
  rpc GetProductDetail(GetProductDetailRequest) returns (GetProductDetailResponse);
  rpc CreateProductDetail(CreateProductDetailRequest) returns (CreateProductDetailResponse);
  rpc UpdateProductDetail(UpdateProductDetailRequest) returns (UpdateProductDetailResponse);
  rpc DeleteProductDetail(DeleteProductDetailRequest) returns (DeleteProductDetailResponse);
}

message ListProductDetailsRequest {
  optional uint32 product_id = 1;
}

message ListProductDetailsResponse {
  repeated ProductDetail details = 1;
}

message GetProductDetailRequest {
  uint32 id = 1;
}

message GetProductDetailResponse {
  ProductDetail detail = 1;
}

message CreateProductDetailRequest {
  uint32 product_id = 1;
  string image_url = 2;
  string description = 3;
  int32 sort_order = 4;
}

message CreateProductDetailResponse {
  ProductDetail detail = 1;
}

message UpdateProductDetailRequest {
  uint32 id = 1;
  uint32 product_id = 2;
  string image_url = 3;
  string description = 4;
  int32 sort_order = 5;
}

message UpdateProductDetailResponse {
  ProductDetail detail = 1;
}

message DeleteProductDetailRequest {
  uint32 id = 1;
}

message DeleteProductDetailResponse {}
