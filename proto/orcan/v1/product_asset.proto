syntax = "proto3";

package orcan.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/asamigentoku/PinguCoin/server/orcan-api/internal/pb/orcan/v1;orcanv1";

message ProductAssetPurpose {
  uint32 id = 1;
  string name = 2;
  bool is_public = 3;
}

message ProductAsset {
  uint32 id = 1;
  uint32 product_id = 2;
  uint32 purpose_id = 3;
  ProductAssetPurpose purpose = 4;
  string storage_url = 5;
  string original_filename = 6;
  string content_type = 7;
  int64 file_size = 8;
  string description = 9;
  int32 sort_order = 10;
  bool is_primary = 11;
  string metadata = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

service ProductAssetService {
  rpc ListProductAssets(ListProductAssetsRequest) returns (ListProductAssetsResponse);
  rpc GetProductAsset(GetProductAssetRequest) returns (GetProductAssetResponse);
  rpc GetProductAssetUploadURL(GetProductAssetUploadURLRequest) returns (GetProductAssetUploadURLResponse);
  rpc ConfirmProductAssetUpload(ConfirmProductAssetUploadRequest) returns (ConfirmProductAssetUploadResponse);
  rpc DeleteProductAsset(DeleteProductAssetRequest) returns (DeleteProductAssetResponse);
  rpc GetProductAssetDownloadURL(GetProductAssetDownloadURLRequest) returns (GetProductAssetDownloadURLResponse);
}

message ListProductAssetsRequest {
  uint32 product_id = 1;
  optional uint32 purpose_id = 2;
}

message ListProductAssetsResponse {
  repeated ProductAsset assets = 1;
}

message GetProductAssetRequest { uint32 id = 1; }
message GetProductAssetResponse { ProductAsset asset = 1; }

message GetProductAssetUploadURLRequest {
  uint32 user_id = 1;
  uint32 product_id = 2;
  uint32 purpose_id = 3;
}

message GetProductAssetUploadURLResponse {
  string blob_endpoint = 1;
  string container = 2;
  string path_prefix = 3;
  string sas_token = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message ConfirmProductAssetUploadRequest {
  uint32 user_id = 1;
  uint32 product_id = 2;
  uint32 purpose_id = 3;
  string file_url = 4;
  string original_filename = 5;
  string content_type = 6;
  int64 file_size = 7;
  string description = 8;
  int32 sort_order = 9;
  bool is_primary = 10;
  string metadata = 11;
}

message ConfirmProductAssetUploadResponse { ProductAsset asset = 1; }

message DeleteProductAssetRequest {
  uint32 user_id = 1;
  uint32 asset_id = 2;
}

message DeleteProductAssetResponse {}

message GetProductAssetDownloadURLRequest { uint32 asset_id = 1; }

message GetProductAssetDownloadURLResponse {
  string download_url = 1;
  google.protobuf.Timestamp expires_at = 2;
}
